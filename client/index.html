<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>PGP Crypter - Secure Encryption Made Simple</title>
    <meta name="description" content="Easy-to-use web-based PGP encryption and decryption tool. Generate keys, encrypt text and files securely in your browser. No server-side storage for maximum security.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/openpgp@5.11.0/dist/openpgp.min.js"></script>
    <script>
      // Ensure openpgp is available globally
      window.addEventListener('DOMContentLoaded', function() {
        if (typeof openpgp === 'undefined') {
          console.error('OpenPGP library failed to load');
        } else {
          console.log('OpenPGP library loaded successfully');
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
